# AutoOps laptop demo: the SAME stack files as production (stacks/app, stacks/monitoring)
# plus local-only helpers: an S3 server for backups, the watchdog loop and an "ops"
# container that runs backups/verification/reports on a schedule.
#
#   make local-up      (or: docker network create autoops; docker compose -f local/compose.yml up -d --build)
#
# Note on overrides: relative paths inside overrides/*.yml resolve from the FIRST file
# of each include entry (stacks/...), hence the ../../local/... paths there.
name: autoops

include:
  - path: [../stacks/app/compose.yml, ./overrides/app.local.yml]
    env_file: ./.env
  - path: [../stacks/monitoring/compose.yml, ./overrides/monitoring.local.yml]
    env_file: ./.env

services:
  # S3-compatible object storage standing in for Backblaze B2 / Cloudflare R2.
  s3:
    networks: [autoops]
    image: versity/versitygw:v1.7.0
    restart: unless-stopped
    command: ["posix", "/data"]
    environment:
      ROOT_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      ROOT_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:7070/ 2>&1 | grep -q 'HTTP/'"]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      autoheal: "true"
      autoops.role: storage

  # Production runs scripts/watchdog/watchdog.py from a systemd timer every minute;
  # here the same script loops inside a container every 20 s.
  watchdog:
    networks: [autoops]
    build:
      context: ..
      dockerfile: local/watchdog/Dockerfile
    image: autoops/watchdog:local
    restart: unless-stopped
    command: ["python3", "/opt/autoops/scripts/watchdog/watchdog.py", "--loop", "20"]
    environment:
      WATCHDOG_PROJECTS: autoops
      WATCHDOG_GRACE_SECONDS: "60"
      WATCHDOG_DISK_PATHS: /chaosdisk
      WATCHDOG_DISK_THRESHOLD: "85"
      WATCHDOG_CLEAN_GLOBS: /chaosdisk/tmp/*
      WATCHDOG_DOCKER_PRUNE: "0"      # never prune images on a developer laptop
      WATCHDOG_RESTART_DOCKER: "0"    # Docker Desktop cannot be restarted from a container
      WATCHDOG_TEXTFILE_DIR: /textfile
      WATCHDOG_STATE_FILE: /state/watchdog-state.json
      WATCHDOG_MAINTENANCE_FILE: /state/maintenance
      NOTIFY_URL: http://notify-relay:9095/notify
      SERVER_NAME: ${SERVER_NAME}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../scripts:/opt/autoops/scripts:ro
      - textfile:/textfile
      - chaosdisk:/chaosdisk
      - autoops-state:/state
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /textfile/autoops_watchdog.prom) )) -lt 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      autoops.role: selfheal

  # Backups at 03:00, restore verification Sunday 04:00, weekly report Monday 09:00 (Asia/Tashkent).
  ops:
    networks: [autoops]
    build:
      context: ..
      dockerfile: local/ops/Dockerfile
    image: autoops/ops:local
    restart: unless-stopped
    environment:
      TZ: Asia/Tashkent
      SERVER_NAME: ${SERVER_NAME}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      BACKUP_APPS: ${APP_NAME}
      VERIFY_TABLES: core_note
      TEXTFILE_DIR: /textfile
      NOTIFY_URL: http://notify-relay:9095/notify
      PROMETHEUS_URL: http://prometheus:9090
      RELAY_URL: http://notify-relay:9095
      WATCHDOG_MAINTENANCE_FILE: /state/maintenance
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../scripts:/opt/autoops/scripts:ro
      - textfile:/textfile
      - backup-staging:/var/backups/autoops
      - autoops-state:/state
    depends_on:
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "crond"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      autoops.role: backup

networks:
  autoops:
    external: true

volumes:
  s3-data:
  textfile:
  backup-staging:
  autoops-state:
  chaosdisk:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=300m
