name: Infra lint

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: yamllint, ansible-lint, shellcheck, ruff, promtool, amtool, actionlint, compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build tools image (same as `make lint` locally)
        uses: docker/build-push-action@v6
        with:
          context: tools
          load: true
          tags: autoops/tools:ci
          cache-from: type=gha,scope=tools
          cache-to: type=gha,scope=tools,mode=max
      - name: Run linters
        run: docker run --rm -v "$PWD:/work" -w /work autoops/tools:ci scripts/dev/lint.sh
