name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # include the workflow name: when Deploy calls this file it gets its own group
  # instead of cancelling (or being cancelled by) the standalone CI run
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-tests:
    name: Sample app - lint + tests (Postgres, Redis)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sample-app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      POSTGRES_HOST: localhost
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ci-password
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sample-app/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q

  rules-tests:
    name: Alert rules unit tests (promtool)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: promtool test rules
        run: |
          docker run --rm -v "$PWD/stacks/monitoring/prometheus:/p" -w /p --entrypoint promtool \
            prom/prometheus:v3.5.0 test rules tests/rules_test.yml

  build:
    name: Build image
    runs-on: ubuntu-24.04
    needs: [app-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: sample-app
          target: runtime
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
