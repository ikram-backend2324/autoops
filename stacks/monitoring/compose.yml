# AutoOps monitoring, logging, alerting and self-healing stack (one per server).
#
# Ports are bound to 127.0.0.1 only: reach them through an SSH tunnel
# (see docs/RUN.md). Grafana is additionally published by Traefik on
# grafana.<domain> when TRAEFIK_ENABLE=true.
# Paths that differ between a server and the laptop demo are variables
# (AUTOOPS_*); defaults are the server layout created by Ansible.

x-defaults: &defaults
  restart: unless-stopped
  networks: [autoops]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  prometheus:
    <<: *defaults
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
      - --web.enable-lifecycle
      - --web.external-url=${PROMETHEUS_EXTERNAL_URL:-http://localhost:9090}
    environment:
      SERVER_NAME: ${SERVER_NAME:-local}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${AUTOOPS_RULES_DIR:-./prometheus/rules}:/etc/prometheus/rules:ro
      - ${AUTOOPS_TARGETS_DIR:-./prometheus/targets}:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      autoheal: "true"
      autoops.role: monitoring

  alertmanager:
    <<: *defaults
    image: prom/alertmanager:v0.28.1
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      TZ: Asia/Tashkent
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3000}
      ALERTMANAGER_EXTERNAL_URL: ${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      autoheal: "true"
      autoops.role: monitoring

  notify-relay:
    <<: *defaults
    build: ./notify-relay
    image: autoops/notify-relay:local
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SERVER_NAME: ${SERVER_NAME:-local}
    volumes:
      - relay-data:/data
    ports:
      - "127.0.0.1:9095:9095"
    labels:
      autoheal: "true"
      autoops.role: monitoring

  grafana:
    <<: *defaults
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3000}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/autoops/server-overview.json
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Asia/Tashkent
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards/autoops:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - autoheal=true
      - autoops.role=monitoring
      - traefik.enable=${TRAEFIK_ENABLE:-false}
      - traefik.docker.network=autoops
      - traefik.http.routers.grafana.rule=Host(`${GRAFANA_DOMAIN:-grafana.localhost}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=letsencrypt
      - traefik.http.routers.grafana.middlewares=secure-headers@file,rate-limit@file
      - traefik.http.services.grafana.loadbalancer.server.port=3000

  loki:
    <<: *defaults
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      autoheal: "true"
      autoops.role: monitoring

  alloy:
    <<: *defaults
    image: grafana/alloy:v1.10.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      SERVER_NAME: ${SERVER_NAME:-local}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      autoheal: "true"
      autoops.role: monitoring

  node-exporter:
    <<: *defaults
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|tmpfs|ramfs)$$
      - --collector.systemd
    pid: host
    volumes:
      - /:/host:ro,rslave
      - ${AUTOOPS_TEXTFILE_DIR:-/var/lib/node_exporter/textfile}:/textfile:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      autoheal: "true"
      autoops.role: monitoring

  cadvisor:
    <<: *defaults
    image: ghcr.io/google/cadvisor:0.57.0
    privileged: true
    command:
      - --housekeeping_interval=10s
      - --docker_only=true
      - --store_container_labels=false
      - --whitelisted_container_labels=autoops.app,autoops.role,com.docker.compose.project,com.docker.compose.service
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      autoheal: "true"
      autoops.role: monitoring

  blackbox:
    <<: *defaults
    image: prom/blackbox-exporter:v0.27.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9115/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      autoheal: "true"
      autoops.role: monitoring

  # Restarts any container labelled autoheal=true whose healthcheck fails,
  # and reports every restart through notify-relay (-> Telegram).
  autoheal:
    <<: *defaults
    image: willfarrell/autoheal:latest@sha256:fb32c57e2a62bfa2e0b882a2ae544a8edd642025cef1647cb8cba564ac84adb8
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "5"
      AUTOHEAL_START_PERIOD: "30"
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "10"
      WEBHOOK_URL: http://notify-relay:9095/notify
      WEBHOOK_JSON_KEY: text
      TZ: Asia/Tashkent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      autoops.role: selfheal

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  alloy-data:
  relay-data:

networks:
  autoops:
    external: true
