base_packages:
  - ca-certificates
  - curl
  - gnupg
  - jq
  - htop
  - ncdu
  - rsync
  - unzip
  - bzip2
  - logrotate
  - chrony
  - unattended-upgrades
  - apt-listchanges
  - needrestart
  - python3
  - util-linux

# Swap only on small machines (RAM < base_swap_when_ram_below_mb)
base_swap_when_ram_below_mb: 4096
base_swap_size_mb: 2048
base_swap_file: /swapfile

base_sysctl:
  vm.swappiness: 10
  vm.overcommit_memory: 1            # recommended by Redis
  fs.file-max: 2097152
  fs.inotify.max_user_watches: 524288
  net.core.somaxconn: 4096
  net.ipv4.tcp_max_syn_backlog: 4096
  net.ipv4.tcp_syncookies: 1
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.all.send_redirects: 0
  kernel.panic: 10                   # reboot 10s after a kernel panic

base_nofile_limit: 65535

base_directories:
  - { path: "{{ autoops_root }}", mode: "0755" }
  - { path: "{{ autoops_root }}/bin", mode: "0755" }
  - { path: "{{ autoops_root }}/stacks", mode: "0755" }
  - { path: "{{ autoops_root }}/apps", mode: "0755" }   # per-app dirs are 0750 root:deploy
  - { path: /etc/autoops, mode: "0750" }
  - { path: /var/lib/autoops, mode: "0755" }
  - { path: /var/lib/node_exporter/textfile, mode: "0755" }
  - { path: /var/backups/autoops, mode: "0700" }
