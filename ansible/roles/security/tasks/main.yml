- name: Refuse to lock ourselves out
  ansible.builtin.assert:
    that:
      - autoops_admin_keys | select | list | length > 0
    fail_msg: >-
      autoops_admin_keys is empty. Root and password logins are about to be disabled;
      put your public key in ~/.ssh/id_ed25519.pub or set autoops_admin_keys in the inventory.

- name: Install security packages
  ansible.builtin.apt:
    name: [openssh-server, ufw, fail2ban, sudo]
    state: present
    update_cache: true
    cache_valid_time: 3600

# ---------------------------------------------------------------- users
- name: Create admin user (sudo, SSH keys only)
  ansible.builtin.user:
    name: "{{ autoops_admin_user }}"
    shell: /bin/bash
    groups: [sudo]
    append: true
    password: "!"
    update_password: on_create

- name: Authorise admin SSH keys
  ansible.posix.authorized_key:
    user: "{{ autoops_admin_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ autoops_admin_keys | select | list }}"
  no_log: false

- name: Passwordless sudo for the admin user (no password exists to type)
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ autoops_admin_user }}"
    content: "{{ autoops_admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

- name: Create CI deploy user (no sudo, no password)
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    password: "!"
    update_password: on_create

# The deploy keys are restricted to a forced command - see roles/app/templates/ci-deploy.sh.j2.
- name: Authorise CI deploy keys (forced command, no shell/forwarding)
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ item }}"
    key_options: 'command="{{ autoops_root }}/bin/ci-deploy",no-port-forwarding,no-X11-forwarding,no-agent-forwarding,no-pty'
    state: present
  loop: "{{ deploy_keys | select | list }}"

- name: Lock root password
  ansible.builtin.user:
    name: root
    password_lock: true
  when: security_lock_root_password | bool

# ---------------------------------------------------------------- firewall
# Open the (possibly new) SSH port BEFORE sshd moves to it.
- name: Firewall - allow SSH
  community.general.ufw:
    rule: limit
    port: "{{ ssh_port | string }}"
    proto: tcp
    comment: ssh
  when: security_ufw_enabled | bool
  tags: [molecule-notest]   # needs iptables/netfilter in the kernel namespace

- name: Firewall - allow HTTP/HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ security_ufw_allowed_tcp }}"
  when: security_ufw_enabled | bool
  tags: [molecule-notest]

- name: Firewall - deny incoming by default and enable
  community.general.ufw:
    state: enabled
    direction: incoming
    policy: deny
  when: security_ufw_enabled | bool
  tags: [molecule-notest]

# ---------------------------------------------------------------- SSH
- name: Use classic ssh.service instead of socket activation (Ubuntu 24.04)
  ansible.builtin.systemd_service:
    name: ssh.socket
    enabled: false
    state: stopped
  when: security_disable_ssh_socket | bool
  failed_when: false   # unit does not exist on Ubuntu 22.04
  tags: [molecule-notest]

- name: Privilege separation directory needed by `sshd -t` (normally created by the running service)
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Harden sshd
  ansible.builtin.template:
    src: sshd-autoops.conf.j2
    dest: /etc/ssh/sshd_config.d/10-autoops.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Make sure sshd runs
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true
  tags: [molecule-notest]

# ---------------------------------------------------------------- fail2ban
- name: Configure fail2ban
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  when: security_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Enable fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  when: security_fail2ban_enabled | bool
  tags: [molecule-notest]   # needs iptables
