- name: Remove distro Docker packages that conflict with Docker CE
  ansible.builtin.apt:
    name: [docker.io, docker-doc, docker-compose, podman-docker, containerd, runc]
    state: absent

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker CE and Compose v2
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Ensure /etc/docker exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Configure Docker daemon (log rotation, live-restore)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_options | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Allow admin and deploy users to use Docker
  ansible.builtin.user:
    name: "{{ item }}"
    groups: [docker]
    append: true
  loop:
    - "{{ autoops_admin_user }}"
    - "{{ deploy_user }}"

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  when: docker_start_service | bool

- name: Flush handlers so daemon.json is active before stacks start
  ansible.builtin.meta: flush_handlers

- name: Create shared network for proxy, apps and monitoring
  ansible.builtin.shell: |
    docker network inspect {{ docker_network }} >/dev/null 2>&1 && echo exists || docker network create {{ docker_network }}
  register: docker_net
  changed_when: "'exists' not in docker_net.stdout"
  when: docker_start_service | bool
